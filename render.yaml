services:
  - type: web
    name: gravel-deals-bot
    runtime: python
    buildCommand: ""
    startCommand: python gravel_tracker.py --bot
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PORT
        value: 10000
