name: Gravel Deals Auto-Scanner

on:
  schedule:
    # Se ejecuta al minuto 0 de cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

# Permisos para que el action pueda guardar la base de datos actualizada
permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Rastreo y Enviar Alertas a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 gravel_tracker.py --scan

      - name: Persistir Base de Datos Actualizada
        run: |
          git config user.name "Gravel Bot"
          git config user.email "bot@gravel.local"
          git add gravel_madrid.db
          # Solo hace commit si hay cambios reales en los precios o registros
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: sincronización de precios e historial [skip ci]"
            git push
          else
            echo "No hay variaciones en la base de datos."
          fi
