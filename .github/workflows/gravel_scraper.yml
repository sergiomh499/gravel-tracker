name: Gravel Deals Auto-Scanner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Ejecución automática cada 3 horas durante el día (06:00 a 21:00 UTC)
    - cron: '0 6,9,12,15,18,21 * * *'
  workflow_dispatch: # Permite ejecución manual bajo demanda desde GitHub

# Permisos para que el action pueda guardar la base de datos y la documentación actualizada
permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Batería de Tests Unitarios e Integrados
        run: |
          python3 test_new_features.py
          python3 test_intensive.py
      - name: Validar Catálogo y Sincronización
        run: |
          python3 gravel_tracker.py --validate
          python3 gravel_tracker.py --sync-doc
      - name: Auditar Enlaces Vivos y Recalcular Rúbrica Calibrada
        run: |
          python3 gravel_tracker.py --audit --limit 30
          python3 gravel_tracker.py --re-score

      - name: Ejecutar Rastreo y Enviar Alertas a Telegram (Sólo en Cron o Dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 gravel_tracker.py --scan
      - name: Persistir Base de Datos y Tier List Actualizada (Sólo en Cron o Dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Gravel Bot"
          git config user.email "bot@gravel.local"
          # Sincronizar concurrentemente resolviendo conflictos binarios a favor de la ejecución actual
          git pull --rebase origin main || (git checkout --theirs gravel_madrid.db && git add gravel_madrid.db && git rebase --continue) || true
          git add gravel_madrid.db directorio_bicicletas.md catalog_snapshot.json
          # Solo hace commit si hay cambios reales en los precios, stock o registros
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: sincronización robótica de stock, precios y Tier List [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main) || true
          else
            echo "No hay variaciones en la base de datos ni en el Tier List."
          fi
