name: Gravel Deals Auto-Scanner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Se ejecuta todos los días a las 08:00 AM hora peninsular española (Madrid)
    # 06:00 UTC en horario de verano (CEST, UTC+2) y 07:00 UTC en horario de invierno (CET, UTC+1)
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecución manual bajo demanda desde GitHub
# Permisos para que el action pueda guardar la base de datos actualizada
permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Batería de Tests Unitarios e Integrados
        run: |
          python3 test_intensive.py
          python3 test_bot.py

      - name: Validar Catálogo y Sincronización
        run: |
          python3 gravel_tracker.py --validate

      - name: Ejecutar Rastreo y Enviar Alertas a Telegram (Sólo en Cron o Dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 gravel_tracker.py --scan

      - name: Persistir Base de Datos Actualizada (Sólo en Cron o Dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Gravel Bot"
          git config user.email "bot@gravel.local"
          git add gravel_madrid.db
          # Solo hace commit si hay cambios reales en los precios o registros
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: sincronización de precios e historial [skip ci]"
            git push
          else
            echo "No hay variaciones en la base de datos."
          fi
